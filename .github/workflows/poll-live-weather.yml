name: Poll live New York weather

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/poll-live-weather.yml"
      - "scripts/poll_live_weather.py"
      - "src/live_weather.py"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-live-weather
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install polling dependency
        run: python -m pip install "requests>=2.32,<3"

      - name: Poll Open-Meteo
        run: python scripts/poll_live_weather.py

      - name: Commit changed observation
        shell: bash
        run: |
          git config user.name "Urban Mobility Weather Bot"
          git config user.email "urban-mobility-weather-bot@users.noreply.github.com"
          git add data/live_weather.json
          if git diff --cached --quiet; then
            echo "Weather observation is unchanged; no commit needed."
          else
            git commit -m "Update live New York weather"
            git push
          fi
